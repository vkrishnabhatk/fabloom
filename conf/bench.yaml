# Benchmark arms and gates (`fabloom bench`, ADR-0007).
#
# Every arm grades against the scenario's ground-truth intent, never the planner's reading of
# the request, so arms differ only in who writes and repairs the configs. Model names refer to
# conf/models.yaml; `roles` overrides that file's routing for this arm only.
#
# "Super + verify-only" from the architecture is not a separate arm: its pass rate is the
# first-pass rate of super-repair, which the report already shows.
# super-repair-grounding is super-repair plus doc-grounded repair (llm/grounding.py): the
# only difference between the two arms, so the grounding gate below measures grounding alone.
# It needs FABLOOM_TAVILY_API_KEY; leave it out with --arm when there is no key.

arms:
  nano-raw:
    description: Nano writes the configs once; no repair.
    roles: {generator: nano}
    max_repair_rounds: 0
  super-raw:
    description: Super writes the configs once; no repair.
    roles: {generator: super}
    max_repair_rounds: 0
  ultra-raw:
    description: Ultra writes the configs once; no repair.
    roles: {generator: ultra}
    max_repair_rounds: 0
  super-repair:
    description: Super writes, Batfish verifies, Super repairs; never escalates.
    roles: {generator: super, repairer: super, repairer_escalated: super}
  super-repair-grounding:
    description: super-repair, plus vendor-doc excerpts for unrecognised lines (Tavily).
    roles: {generator: super, repairer: super, repairer_escalated: super}
    grounding: true
  routed:
    description: The product's routing from conf/models.yaml, Ultra on repeated failure.
    roles: {}

gates:
  regression:
    # Compared per arm on the scenarios both runs share, against the frozen baseline.
    # On a 10-scenario nightly one scenario is 10 points, so 0.10 tolerates one flip.
    metrics: [final_pass_rate, first_pass_rate]
    max_drop: 0.10
  grounding:
    # Grounding ships only if it lifts the final pass rate without blowing up the cost.
    arm: super-repair-grounding
    control: super-repair
    min_gain: 0.05
    max_cost_ratio: 1.5

# `fabloom bench run --nightly`: a small, family-balanced subset on one arm.
nightly:
  arms: [routed]
  scenarios: 10
