hostname leaf4
feature bgp
interface loopback0
  ip address 10.0.1.4/32
interface Ethernet1/1
  no switchport
  ip address 10.1.0.49/31
  no shutdown
interface Ethernet1/2
  no switchport
  ip address 10.1.0.51/31
  no shutdown
ip access-list ACL-SSH
  10 permit ip 10.0.0.0 0.255.255.255 any
  20 deny tcp any host 10.0.1.4 eq 22
  30 permit ip any any
interface Ethernet1/1
  ip access-group ACL-SSH in
interface Ethernet1/2
  ip access-group ACL-SSH in
router bgp 65104
  router-id 10.0.1.4
  address-family ipv4 unicast
    network 10.0.1.4/32
  neighbor 10.1.0.48
    remote-as 65000
    address-family ipv4 unicast
  neighbor 10.1.0.50
    remote-as 65000
    address-family ipv4 unicast
