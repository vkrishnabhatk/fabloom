# Model routing (ADR-0005). Changing a model is a config change here, never a code change.
#
# IDs and prices confirmed against Token Factory on 22 Oct 2026: `/v1/models?verbose=true`
# returns each model's per-token pricing, and spikes/nemotron_probe.py made a structured call
# to every model (ADR-0005). A model added later starts `price_verified: false` with a
# pessimistic price until it is checked the same way.
# `fabloom doctor` asserts every ID below exists on Token Factory and answers in JSON mode.

models:
  nano:
    id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
    usd_per_m_input: 0.06
    usd_per_m_output: 0.24
    price_verified: true
    # 262k context and no separate output cap advertised. 4096 truncated ~9 of the 49 v0.1
    # scenarios, so nano-raw measured the cap, not the model; matched to Super instead.
    max_output_tokens: 12000
    temperature: 0.0        # planner output is structured; no creativity wanted
  super:
    id: nvidia/nemotron-3-super-120b-a12b
    usd_per_m_input: 0.30
    usd_per_m_output: 0.90
    price_verified: true
    max_output_tokens: 12000  # a 20-device fabric is ~10k tokens of config
    temperature: 0.2
  ultra:
    id: nvidia/Nemotron-3-Ultra-550b-a55b
    usd_per_m_input: 1.00
    usd_per_m_output: 3.00
    price_verified: true
    max_output_tokens: 12000
    temperature: 0.2

roles:
  planner: nano
  generator: super
  repairer: super
  repairer_escalated: ultra
  explainer: nano

# Escalate to repairer_escalated only on repeated failure.
escalation:
  from_round: 3            # any failure still present at round 3
  critical_from_round: 2   # a parse failure (critical) that survived one repair
