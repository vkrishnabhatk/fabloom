hostname leaf6
service routing protocols model multi-agent
ip routing
ip access-list TELNET_BLOCK
 deny tcp any any eq 23
 permit ip any any
interface Loopback0
 ip address 10.0.1.6/32
interface Ethernet1
 no switchport
 ip address 10.1.0.81/31
 ip access-group TELNET_BLOCK in
interface Ethernet2
 no switchport
 ip address 10.1.0.83/31
 ip access-group TELNET_BLOCK in
interface Ethernet3
 no switchport
 ip address 10.1.0.85/31
 ip access-group TELNET_BLOCK in
interface Ethernet4
 no switchport
 ip address 10.1.0.87/31
 ip access-group TELNET_BLOCK in
router bgp 65205
 router-id 10.0.1.6
 neighbor 10.1.0.80 remote-as 65100
 neighbor 10.1.0.82 remote-as 65100
 neighbor 10.1.0.84 remote-as 65100
 neighbor 10.1.0.86 remote-as 65100
 network 10.0.1.6/32
