hostname leaf5
service routing protocols model multi-agent
ip routing
ip access-list TELNET_BLOCK
 deny tcp any any eq 23
 permit ip any any
interface Loopback0
 ip address 10.0.1.5/32
interface Ethernet1
 no switchport
 ip address 10.1.0.65/31
 ip access-group TELNET_BLOCK in
interface Ethernet2
 no switchport
 ip address 10.1.0.67/31
 ip access-group TELNET_BLOCK in
interface Ethernet3
 no switchport
 ip address 10.1.0.69/31
 ip access-group TELNET_BLOCK in
interface Ethernet4
 no switchport
 ip address 10.1.0.71/31
 ip access-group TELNET_BLOCK in
router bgp 65204
 router-id 10.0.1.5
 neighbor 10.1.0.64 remote-as 65100
 neighbor 10.1.0.66 remote-as 65100
 neighbor 10.1.0.68 remote-as 65100
 neighbor 10.1.0.70 remote-as 65100
 network 10.0.1.5/32
