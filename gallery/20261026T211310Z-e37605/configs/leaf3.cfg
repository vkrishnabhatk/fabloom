system { host-name leaf3; }
interfaces {
    et-0/0/1 { unit 0 { family inet { address 10.1.0.33/31; filter { input SSH_FILTER; } } } }
    et-0/0/2 { unit 0 { family inet { address 10.1.0.35/31; filter { input SSH_FILTER; } } } }
    lo0 { unit 0 { family inet { address 10.0.1.3/32; } } }
}
routing-options {
    router-id 10.0.1.3;
    autonomous-system 65103;
}
policy-options {
    policy-statement ADV_LOOPBACK {
        term LOOPBACK {
            from {
                protocol direct;
                route-filter 10.0.1.3/32 exact;
            }
            then accept;
        }
    }
}
firewall {
    family inet {
        filter SSH_FILTER {
            term allow_ssh_from_internal {
                from {
                    source-address 10.0.0.0/8;
                    destination-port 22;
                    protocol tcp;
                }
                then accept;
            }
            term deny_ssh_from_any {
                from {
                    destination-port 22;
                    protocol tcp;
                }
                then discard;
            }
            term rest {
                then accept;
            }
        }
    }
}
protocols {
    bgp {
        group FABRIC {
            type external;
            export ADV_LOOPBACK;
            neighbor 10.1.0.32 {
                peer-as 65000;
                local-address 10.1.0.33;
            }
            neighbor 10.1.0.34 {
                peer-as 65000;
                local-address 10.1.0.35;
            }
        }
    }
}
