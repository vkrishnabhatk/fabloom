id: leaf-spine-filters-0001
family: leaf-spine-filters
request: 2 spines, 4 leaves, eBGP underlay on Arista EOS. Spines share AS 65000, each leaf gets its own
  private ASN. Advertise every leaf loopback, and block SSH to the leaves from outside 10.0.0.0/8.
intent:
  platform: arista_eos
  topology:
    spines: 2
    leaves: 4
  bgp_mode: numbered
  asn:
    spine_asn: 65000
    leaf_asn_base: 65101
  addressing:
    loopback_pool: 10.0.0.0/23
    p2p_pool: 10.1.0.0/16
  advertise_loopbacks: true
  filters:
  - action: deny
    devices: leaf*
    protocol: tcp
    dst_port: 22
    src_not_in: 10.0.0.0/8
