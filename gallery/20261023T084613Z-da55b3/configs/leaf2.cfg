hostname leaf2
service routing protocols model multi-agent
ip routing
interface Loopback0
 ip address 10.0.1.2/32
interface Ethernet1
 no switchport
 ip address 10.1.0.17/31
 ip access-group SSH_BLOCK in
interface Ethernet2
 no switchport
 ip address 10.1.0.19/31
 ip access-group SSH_BLOCK in
ip access-list SSH_BLOCK
 10 permit tcp 10.0.0.0/8 any eq 22
 20 deny tcp any any eq 22
 30 permit ip any any
router bgp 65102
 router-id 10.0.1.2
 neighbor 10.1.0.16 remote-as 65000
 neighbor 10.1.0.18 remote-as 65000
 network 10.0.1.2/32
