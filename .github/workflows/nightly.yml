name: nightly

# A model ID retired, or a hosted model silently changing behaviour, during the 1-15 December
# judging window would otherwise go unnoticed until a judge hit it (architecture §7, risks).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Secrets cannot appear in a job-level `if`, so one job reads it and exposes a boolean.
  # Without the key the probes cannot run; skip them instead of failing every night.
  key:
    name: Token Factory key present
    runs-on: ubuntu-latest
    environment: token-factory
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.TOKEN_FACTORY_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TOKEN_FACTORY_API_KEY is not set in the token-factory environment; skipping the nightly probes."
          fi

  doctor:
    name: fabloom doctor (every configured model exists and answers JSON)
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-latest
    environment: token-factory
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.24"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run fabloom doctor
        env:
          FABLOOM_TOKEN_FACTORY_API_KEY: ${{ secrets.TOKEN_FACTORY_API_KEY }}

  live-tests:
    name: llm/sandbox-marked tests
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-latest
    environment: token-factory
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.24"
      # Same extras as CI's test job: collection imports every test module, web included.
      - run: uv sync --frozen --extra batfish --extra eval --extra web
      # Exit code 5 = no tests collected; expected until week 2 adds live suites.
      - run: uv run pytest -m "llm or sandbox" || [ $? -eq 5 ]
        env:
          FABLOOM_TOKEN_FACTORY_API_KEY: ${{ secrets.TOKEN_FACTORY_API_KEY }}
