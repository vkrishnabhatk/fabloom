name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.24"

jobs:
  lint:
    name: lint (ruff, mypy --strict, plane boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra batfish --extra eval --python 3.12
      - run: uv run ruff format --check src tests scripts spikes
      - run: uv run ruff check src tests scripts spikes
      - run: uv run mypy
      - name: import-linter (verify <-/-> llm, agent)
        run: uv run lint-imports
      - run: uv run codespell
      - run: uv run fabloom scenarios validate

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra batfish --extra eval --python ${{ matrix.python }}
      # Offline only: sandbox/llm markers need secrets and run in nightly.yml.
      - run: uv run pytest -m "unit or integration" --cov --cov-report=xml

  security:
    name: security (pip-audit, gitleaks, licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: pip-audit (runtime + dev)
        run: |
          uv export --frozen --all-extras --format requirements-txt --no-emit-project > req.txt
          uvx pip-audit --strict -r req.txt
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact
      - name: no GPL-family licences in runtime dependencies
        run: |
          uv sync --frozen --no-dev --extra batfish --extra eval
          uv run --no-sync --with pip-licenses pip-licenses --partial-match \
            --fail-on="GPL;AGPL" --ignore-packages pip-licenses prettytable wcwidth

  verifier-image:
    name: verifier image (GHCR)
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fabloom-verifier
          tags: |
            type=sha,prefix=git-,format=short
            type=semver,pattern={{version}}
            type=ref,event=branch
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.verifier
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: trivy (fail on fixable critical/high)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fabloom-verifier@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fabloom-verifier
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
