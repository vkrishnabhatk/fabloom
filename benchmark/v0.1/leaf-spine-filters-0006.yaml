id: leaf-spine-filters-0006
family: leaf-spine-filters
request: EOS fabric with 2 spines and 4 leaves on an eBGP underlay. NETCONF (tcp 830) must not reach the
  spines from anywhere. Advertise loopbacks.
intent:
  platform: arista_eos
  topology:
    spines: 2
    leaves: 4
  bgp_mode: numbered
  asn:
    spine_asn: 65000
    leaf_asn_base: 65101
  addressing:
    loopback_pool: 10.0.0.0/23
    p2p_pool: 10.1.0.0/16
  advertise_loopbacks: true
  filters:
  - action: deny
    devices: spine*
    protocol: tcp
    dst_port: 830
    src_not_in: null
