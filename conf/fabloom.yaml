# Run defaults. Secrets and per-deployment values live in the environment (FABLOOM_*),
# never here; see fabloom.config.Settings.

run:
  # Parallel repair candidates per round. 1 for the local backend (one Batfish server);
  # raise once the sandbox backend fans candidates out across executions (ADR-0003).
  repair_candidates: 1
  budget:
    max_repair_rounds: 3
    max_tokens: 250000
    max_usd: 0.25            # a Super run is ~$0.01; this is the runaway guard, not a target
    max_wall_clock_s: 900
    max_verifications: 12
    max_grounding_queries: 6   # Tavily searches per run; cached lookups are free

  # Doc-grounded repair (ADR-0008). When Batfish reports unrecognised lines, search the
  # vendor's own documentation for the real syntax and put the excerpts in the repair prompt.
  # Off here: only the super-repair-grounding arm in conf/bench.yaml turns it on, and it ships
  # in the product only if that arm passes the grounding gate. Needs FABLOOM_TAVILY_API_KEY.
  grounding:
    enabled: false
    domains:
      frr: [docs.frrouting.org]
      # The EOS user manual path, not the domain: arista.com alone returns marketing pages
      # (measured 2026-10-22 with "neighbor bfd fast-detect").
      arista_eos: [arista.com/en/um-eos]
      junos: [juniper.net/documentation]
      cisco_nxos: [cisco.com/c/en/us/td/docs/dcn/nx-os, cisco.com/c/en/us/td/docs/switches/datacenter]
      cisco_iosxe: [cisco.com/c/en/us/td/docs/ios-xml, cisco.com/c/en/us/td/docs/switches/lan]
      cisco_iosxr: [cisco.com/c/en/us/td/docs/iosxr, cisco.com/c/en/us/td/docs/routers]
      sonic: [github.com/sonic-net/SONiC]
    max_results: 3
    max_excerpt_chars: 800
    min_interval_s: 1.0
    timeout_s: 15

  # Vendor docs for what the run built, linked beside the result: one Tavily search per
  # feature the intent uses (BGP mode, loopbacks, filters), restricted to the domains above
  # and cached. Never part of a prompt or a check. Skipped without FABLOOM_TAVILY_API_KEY.
  docs:
    enabled: true
    max_queries: 3
    max_links: 6
    cache_ttl_days: 7
