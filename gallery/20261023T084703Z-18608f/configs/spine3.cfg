hostname spine3
service routing protocols model multi-agent
ip routing
ip access-list TELNET_BLOCK
 deny tcp any any eq 23
 permit ip any any
interface Loopback0
 ip address 10.0.0.3/32
interface Ethernet1
 no switchport
 ip address 10.1.0.4/31
 ip access-group TELNET_BLOCK in
interface Ethernet2
 no switchport
 ip address 10.1.0.20/31
 ip access-group TELNET_BLOCK in
interface Ethernet3
 no switchport
 ip address 10.1.0.36/31
 ip access-group TELNET_BLOCK in
interface Ethernet4
 no switchport
 ip address 10.1.0.52/31
 ip access-group TELNET_BLOCK in
interface Ethernet5
 no switchport
 ip address 10.1.0.68/31
 ip access-group TELNET_BLOCK in
interface Ethernet6
 no switchport
 ip address 10.1.0.84/31
 ip access-group TELNET_BLOCK in
router bgp 65100
 router-id 10.0.0.3
 neighbor 10.1.0.5 remote-as 65200
 neighbor 10.1.0.21 remote-as 65201
 neighbor 10.1.0.37 remote-as 65202
 neighbor 10.1.0.53 remote-as 65203
 neighbor 10.1.0.69 remote-as 65204
 neighbor 10.1.0.85 remote-as 65205
 network 10.0.0.3/32
