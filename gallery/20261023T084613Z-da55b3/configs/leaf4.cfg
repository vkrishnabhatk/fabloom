hostname leaf4
service routing protocols model multi-agent
ip routing
interface Loopback0
 ip address 10.0.1.4/32
interface Ethernet1
 no switchport
 ip address 10.1.0.49/31
 ip access-group SSH_BLOCK in
interface Ethernet2
 no switchport
 ip address 10.1.0.51/31
 ip access-group SSH_BLOCK in
ip access-list SSH_BLOCK
 10 permit tcp 10.0.0.0/8 any eq 22
 20 deny tcp any any eq 22
 30 permit ip any any
router bgp 65104
 router-id 10.0.1.4
 neighbor 10.1.0.48 remote-as 65000
 neighbor 10.1.0.50 remote-as 65000
 network 10.0.1.4/32
