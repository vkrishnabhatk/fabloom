system { host-name spine1; }
interfaces {
    et-0/0/1 { unit 0 { family inet { address 10.1.0.0/31; } } }
    et-0/0/2 { unit 0 { family inet { address 10.1.0.16/31; } } }
    et-0/0/3 { unit 0 { family inet { address 10.1.0.32/31; } } }
    et-0/0/4 { unit 0 { family inet { address 10.1.0.48/31; } } }
    lo0 { unit 0 { family inet { address 10.0.0.1/32; } } }
}
routing-options {
    router-id 10.0.0.1;
    autonomous-system 65000;
}
policy-options {
    policy-statement ADV_LOOPBACK {
        term LOOPBACK {
            from {
                protocol direct;
                route-filter 10.0.0.1/32 exact;
            }
            then accept;
        }
    }
}
protocols {
    bgp {
        group FABRIC {
            type external;
            export ADV_LOOPBACK;
            neighbor 10.1.0.1 {
                peer-as 65101;
                local-address 10.1.0.0;
            }
            neighbor 10.1.0.17 {
                peer-as 65102;
                local-address 10.1.0.16;
            }
            neighbor 10.1.0.33 {
                peer-as 65103;
                local-address 10.1.0.32;
            }
            neighbor 10.1.0.49 {
                peer-as 65104;
                local-address 10.1.0.48;
            }
        }
    }
}
