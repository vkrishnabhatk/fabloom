frr version 8.4
frr defaults datacenter
hostname leaf2
interface lo
 ip address 10.0.1.2/32
interface swp1
interface swp2
router bgp 65102
 bgp router-id 10.0.1.2
 neighbor swp1 interface remote-as external
 neighbor swp2 interface remote-as external
 address-family ipv4 unicast
  network 10.0.1.2/32
  exit-address-family
