frr version 8.4
frr defaults datacenter
hostname leaf3
interface lo
 ip address 10.0.1.3/32
interface swp1
interface swp2
router bgp 65103
 bgp router-id 10.0.1.3
 neighbor swp1 interface remote-as external
 neighbor swp2 interface remote-as external
 address-family ipv4 unicast
  network 10.0.1.3/32
  exit-address-family
