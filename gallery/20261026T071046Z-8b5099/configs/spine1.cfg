hostname spine1
feature bgp
interface loopback0
  ip address 10.0.0.1/32
interface Ethernet1/1
  no switchport
  ip address 10.1.0.0/31
  no shutdown
interface Ethernet1/2
  no switchport
  ip address 10.1.0.16/31
  no shutdown
interface Ethernet1/3
  no switchport
  ip address 10.1.0.32/31
  no shutdown
interface Ethernet1/4
  no switchport
  ip address 10.1.0.48/31
  no shutdown
router bgp 65000
  router-id 10.0.0.1
  address-family ipv4 unicast
    network 10.0.0.1/32
  neighbor 10.1.0.1
    remote-as 65101
    address-family ipv4 unicast
  neighbor 10.1.0.17
    remote-as 65102
    address-family ipv4 unicast
  neighbor 10.1.0.33
    remote-as 65103
    address-family ipv4 unicast
  neighbor 10.1.0.49
    remote-as 65104
    address-family ipv4 unicast
