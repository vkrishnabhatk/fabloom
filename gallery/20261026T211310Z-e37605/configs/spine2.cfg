system { host-name spine2; }
interfaces {
    et-0/0/1 { unit 0 { family inet { address 10.1.0.2/31; } } }
    et-0/0/2 { unit 0 { family inet { address 10.1.0.18/31; } } }
    et-0/0/3 { unit 0 { family inet { address 10.1.0.34/31; } } }
    et-0/0/4 { unit 0 { family inet { address 10.1.0.50/31; } } }
    lo0 { unit 0 { family inet { address 10.0.0.2/32; } } }
}
routing-options {
    router-id 10.0.0.2;
    autonomous-system 65000;
}
policy-options {
    policy-statement ADV_LOOPBACK {
        term LOOPBACK {
            from {
                protocol direct;
                route-filter 10.0.0.2/32 exact;
            }
            then accept;
        }
    }
}
protocols {
    bgp {
        group FABRIC {
            type external;
            export ADV_LOOPBACK;
            neighbor 10.1.0.3 {
                peer-as 65101;
                local-address 10.1.0.2;
            }
            neighbor 10.1.0.19 {
                peer-as 65102;
                local-address 10.1.0.18;
            }
            neighbor 10.1.0.35 {
                peer-as 65103;
                local-address 10.1.0.34;
            }
            neighbor 10.1.0.51 {
                peer-as 65104;
                local-address 10.1.0.50;
            }
        }
    }
}
