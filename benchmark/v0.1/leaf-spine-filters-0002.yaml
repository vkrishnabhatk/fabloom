id: leaf-spine-filters-0002
family: leaf-spine-filters
request: Arista EOS, 2 spines and 2 leaves with eBGP. Telnet must be blocked to every switch from anywhere.
  Advertise loopbacks.
intent:
  platform: arista_eos
  topology:
    spines: 2
    leaves: 2
  bgp_mode: numbered
  asn:
    spine_asn: 65000
    leaf_asn_base: 65101
  addressing:
    loopback_pool: 10.0.0.0/23
    p2p_pool: 10.1.0.0/16
  advertise_loopbacks: true
  filters:
  - action: deny
    devices: '*'
    protocol: tcp
    dst_port: 23
    src_not_in: null
