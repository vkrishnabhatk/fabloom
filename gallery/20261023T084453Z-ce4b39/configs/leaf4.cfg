frr version 8.4
frr defaults datacenter
hostname leaf4
interface lo
 ip address 10.0.1.4/32
interface swp1
 ip address 10.1.0.49/31
interface swp2
 ip address 10.1.0.51/31
router bgp 65104
 bgp router-id 10.0.1.4
 neighbor 10.1.0.48 remote-as 65000
 neighbor 10.1.0.50 remote-as 65000
 address-family ipv4 unicast
  network 10.0.1.4/32
  exit-address-family
