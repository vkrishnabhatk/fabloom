hostname spine4
service routing protocols model multi-agent
ip routing
ip access-list TELNET_BLOCK
 deny tcp any any eq 23
 permit ip any any
interface Loopback0
 ip address 10.0.0.4/32
interface Ethernet1
 no switchport
 ip address 10.1.0.6/31
 ip access-group TELNET_BLOCK in
interface Ethernet2
 no switchport
 ip address 10.1.0.22/31
 ip access-group TELNET_BLOCK in
interface Ethernet3
 no switchport
 ip address 10.1.0.38/31
 ip access-group TELNET_BLOCK in
interface Ethernet4
 no switchport
 ip address 10.1.0.54/31
 ip access-group TELNET_BLOCK in
interface Ethernet5
 no switchport
 ip address 10.1.0.70/31
 ip access-group TELNET_BLOCK in
interface Ethernet6
 no switchport
 ip address 10.1.0.86/31
 ip access-group TELNET_BLOCK in
router bgp 65100
 router-id 10.0.0.4
 neighbor 10.1.0.7 remote-as 65200
 neighbor 10.1.0.23 remote-as 65201
 neighbor 10.1.0.39 remote-as 65202
 neighbor 10.1.0.55 remote-as 65203
 neighbor 10.1.0.71 remote-as 65204
 neighbor 10.1.0.87 remote-as 65205
 network 10.0.0.4/32
