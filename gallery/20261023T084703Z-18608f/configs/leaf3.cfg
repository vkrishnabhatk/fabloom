hostname leaf3
service routing protocols model multi-agent
ip routing
ip access-list TELNET_BLOCK
 deny tcp any any eq 23
 permit ip any any
interface Loopback0
 ip address 10.0.1.3/32
interface Ethernet1
 no switchport
 ip address 10.1.0.33/31
 ip access-group TELNET_BLOCK in
interface Ethernet2
 no switchport
 ip address 10.1.0.35/31
 ip access-group TELNET_BLOCK in
interface Ethernet3
 no switchport
 ip address 10.1.0.37/31
 ip access-group TELNET_BLOCK in
interface Ethernet4
 no switchport
 ip address 10.1.0.39/31
 ip access-group TELNET_BLOCK in
router bgp 65202
 router-id 10.0.1.3
 neighbor 10.1.0.32 remote-as 65100
 neighbor 10.1.0.34 remote-as 65100
 neighbor 10.1.0.36 remote-as 65100
 neighbor 10.1.0.38 remote-as 65100
 network 10.0.1.3/32
