id: leaf-spine-filters-0003
family: leaf-spine-filters
request: EOS leaf-spine with 2 spines and 4 leaves, eBGP underlay. Only 10.0.0.0/8 may reach SNMP (udp
  161) on the spines; drop it from everywhere else. Loopbacks advertised.
intent:
  platform: arista_eos
  topology:
    spines: 2
    leaves: 4
  bgp_mode: numbered
  asn:
    spine_asn: 65000
    leaf_asn_base: 65101
  addressing:
    loopback_pool: 10.0.0.0/23
    p2p_pool: 10.1.0.0/16
  advertise_loopbacks: true
  filters:
  - action: deny
    devices: spine*
    protocol: udp
    dst_port: 161
    src_not_in: 10.0.0.0/8
