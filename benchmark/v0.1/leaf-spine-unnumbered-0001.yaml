id: leaf-spine-unnumbered-0001
family: leaf-spine-unnumbered
request: 2 spines and 2 leaves on FRR using BGP unnumbered on the fabric links. Spines AS 65000, one ASN
  per leaf, advertise loopbacks.
intent:
  platform: frr
  topology:
    spines: 2
    leaves: 2
  bgp_mode: unnumbered
  asn:
    spine_asn: 65000
    leaf_asn_base: 65101
  addressing:
    loopback_pool: 10.0.0.0/23
    p2p_pool: 10.1.0.0/16
  advertise_loopbacks: true
  filters: []
notes: Needs batfish/layer1_topology.json or sessions silently stay down (arch. risk register).
