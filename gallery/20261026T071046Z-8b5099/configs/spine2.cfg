    network 10.0.0.2/32
  neighbor 10.1.0.3
    remote-as 65101
    address-family ipv4 unicast
  neighbor 10.1.0.19
    remote-as 65102
    address-family ipv4 unicast
  neighbor 10.1.0.35
    remote-as 65103
    address-family ipv4 unicast
  neighbor 10.1.0.51
    remote-as 65104
    address-family ipv4 unicast
