id: leaf-spine-filters-0005
family: leaf-spine-filters
request: Arista EOS, 2 spines and 4 leaves, eBGP underlay. Block HTTPS (tcp 443) to every switch unless
  it comes from 192.168.0.0/16. Loopbacks advertised.
intent:
  platform: arista_eos
  topology:
    spines: 2
    leaves: 4
  bgp_mode: numbered
  asn:
    spine_asn: 65000
    leaf_asn_base: 65101
  addressing:
    loopback_pool: 10.0.0.0/23
    p2p_pool: 10.1.0.0/16
  advertise_loopbacks: true
  filters:
  - action: deny
    devices: '*'
    protocol: tcp
    dst_port: 443
    src_not_in: 192.168.0.0/16
