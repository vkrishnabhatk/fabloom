hostname leaf2
service routing protocols model multi-agent
ip routing
ip access-list TELNET_BLOCK
 deny tcp any any eq 23
 permit ip any any
interface Loopback0
 ip address 10.0.1.2/32
interface Ethernet1
 no switchport
 ip address 10.1.0.17/31
 ip access-group TELNET_BLOCK in
interface Ethernet2
 no switchport
 ip address 10.1.0.19/31
 ip access-group TELNET_BLOCK in
interface Ethernet3
 no switchport
 ip address 10.1.0.21/31
 ip access-group TELNET_BLOCK in
interface Ethernet4
 no switchport
 ip address 10.1.0.23/31
 ip access-group TELNET_BLOCK in
router bgp 65201
 router-id 10.0.1.2
 neighbor 10.1.0.16 remote-as 65100
 neighbor 10.1.0.18 remote-as 65100
 neighbor 10.1.0.20 remote-as 65100
 neighbor 10.1.0.22 remote-as 65100
 network 10.0.1.2/32
