frr version 8.4
frr defaults datacenter
hostname leaf3
interface lo
 ip address 10.0.1.3/32
interface swp1
 ip address 10.1.0.33/31
interface swp2
 ip address 10.1.0.35/31
router bgp 65103
 bgp router-id 10.0.1.3
 neighbor 10.1.0.32 remote-as 65000
 neighbor 10.1.0.34 remote-as 65000
 address-family ipv4 unicast
  network 10.0.1.3/32
  exit-address-family
