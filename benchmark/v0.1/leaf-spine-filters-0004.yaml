id: leaf-spine-filters-0004
family: leaf-spine-filters
request: 4 spines and 4 leaves on Arista EOS with an eBGP underlay. Block SSH to the leaves unless it
  comes from 10.0.0.0/8, and block telnet to all switches outright.
intent:
  platform: arista_eos
  topology:
    spines: 4
    leaves: 4
  bgp_mode: numbered
  asn:
    spine_asn: 65000
    leaf_asn_base: 65101
  addressing:
    loopback_pool: 10.0.0.0/23
    p2p_pool: 10.1.0.0/16
  advertise_loopbacks: true
  filters:
  - action: deny
    devices: leaf*
    protocol: tcp
    dst_port: 22
    src_not_in: 10.0.0.0/8
  - action: deny
    devices: '*'
    protocol: tcp
    dst_port: 23
    src_not_in: null
