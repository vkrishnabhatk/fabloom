id: vendor-junos-0002
family: vendor-junos
request: Build a leaf-spine fabric on Juniper QFX switches running Junos with 2 spines and 4 leaves. eBGP
  underlay with numbered links, advertise loopbacks.
intent:
  platform: junos
  topology:
    spines: 2
    leaves: 4
  bgp_mode: numbered
  asn:
    spine_asn: 65000
    leaf_asn_base: 65101
  addressing:
    loopback_pool: 10.0.0.0/23
    p2p_pool: 10.1.0.0/16
  advertise_loopbacks: true
  filters: []
