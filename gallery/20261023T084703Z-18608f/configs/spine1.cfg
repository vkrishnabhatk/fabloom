hostname spine1
service routing protocols model multi-agent
ip routing
ip access-list TELNET_BLOCK
 deny tcp any any eq 23
 permit ip any any
interface Loopback0
 ip address 10.0.0.1/32
interface Ethernet1
 no switchport
 ip address 10.1.0.0/31
 ip access-group TELNET_BLOCK in
interface Ethernet2
 no switchport
 ip address 10.1.0.16/31
 ip access-group TELNET_BLOCK in
interface Ethernet3
 no switchport
 ip address 10.1.0.32/31
 ip access-group TELNET_BLOCK in
interface Ethernet4
 no switchport
 ip address 10.1.0.48/31
 ip access-group TELNET_BLOCK in
interface Ethernet5
 no switchport
 ip address 10.1.0.64/31
 ip access-group TELNET_BLOCK in
interface Ethernet6
 no switchport
 ip address 10.1.0.80/31
 ip access-group TELNET_BLOCK in
router bgp 65100
 router-id 10.0.0.1
 neighbor 10.1.0.1 remote-as 65200
 neighbor 10.1.0.17 remote-as 65201
 neighbor 10.1.0.33 remote-as 65202
 neighbor 10.1.0.49 remote-as 65203
 neighbor 10.1.0.65 remote-as 65204
 neighbor 10.1.0.81 remote-as 65205
 network 10.0.0.1/32
