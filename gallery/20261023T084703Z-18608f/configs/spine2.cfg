hostname spine2
service routing protocols model multi-agent
ip routing
ip access-list TELNET_BLOCK
 deny tcp any any eq 23
 permit ip any any
interface Loopback0
 ip address 10.0.0.2/32
interface Ethernet1
 no switchport
 ip address 10.1.0.2/31
 ip access-group TELNET_BLOCK in
interface Ethernet2
 no switchport
 ip address 10.1.0.18/31
 ip access-group TELNET_BLOCK in
interface Ethernet3
 no switchport
 ip address 10.1.0.34/31
 ip access-group TELNET_BLOCK in
interface Ethernet4
 no switchport
 ip address 10.1.0.50/31
 ip access-group TELNET_BLOCK in
interface Ethernet5
 no switchport
 ip address 10.1.0.66/31
 ip access-group TELNET_BLOCK in
interface Ethernet6
 no switchport
 ip address 10.1.0.82/31
 ip access-group TELNET_BLOCK in
router bgp 65100
 router-id 10.0.0.2
 neighbor 10.1.0.3 remote-as 65200
 neighbor 10.1.0.19 remote-as 65201
 neighbor 10.1.0.35 remote-as 65202
 neighbor 10.1.0.51 remote-as 65203
 neighbor 10.1.0.67 remote-as 65204
 neighbor 10.1.0.83 remote-as 65205
 network 10.0.0.2/32
